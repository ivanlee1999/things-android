name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v6

      # Fail here with an actionable message. Without a keystore the signingConfig is skipped,
      # Gradle emits app-release-unsigned.apk, and the run falls over much later at "Rename APK"
      # with a missing-file error that reads like a build problem.
      - name: Check signing secrets
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
        run: |
          if [ -z "$KEYSTORE_FILE" ]; then
            echo "::error::KEYSTORE_FILE is not set. Generate a keystore with 'keytool -genkeypair -v -keystore things-release.jks -keyalg RSA -keysize 2048 -validity 10000 -alias things', then set KEYSTORE_FILE (base64 of the .jks), KEYSTORE_PASSWORD, RELEASE_KEY_ALIAS and RELEASE_KEY_PASSWORD as repository secrets."
            exit 1
          fi

      - name: Decode keystore
        id: keystore
        uses: timheuer/base64-to-file@v1.2.4
        with:
          fileDir: ./secrets
          fileName: release.jks
          encodedString: ${{ secrets.KEYSTORE_FILE }}

      - name: Build release APK
        env:
          STORE_FILE: ${{ github.workspace }}/secrets/release.jks
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease --stacktrace

      - name: Read version name
        run: echo "VERSION_NAME=$(./gradlew -q printVersionName)" >> "$GITHUB_ENV"

      - run: mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/things-${{ env.VERSION_NAME }}.apk

      - uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/things-${{ env.VERSION_NAME }}.apk
          tag_name: v${{ env.VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          token: ${{ github.token }}
